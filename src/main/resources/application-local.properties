# Local Development Configuration
# This file is automatically loaded when the Spring profile "local" is active
# To activate: Set SPRING_PROFILES_ACTIVE=local or use -Dspring.profiles.active=local

# Enable local development credentials (Azure CLI, VS Code, IntelliJ)
# IMPORTANT: This must be explicitly set to true by the consuming service.
# It is intentionally absent here so that activating the "local" profile alone
# is not sufficient to enable local dev credentials — explicit opt-in is required.
# azure.local.development.enableLocalCredentials=true

# Disable production authentication methods in local development
azure.paas.workloadidentity.isEnabled=false
azure.paas.podidentity.isEnabled=false

# Disable production-only features that may not work locally
azure.pubsub.publish=false
azure.eventgrid.manager.enabled=false
azure.serviceBus.manager.enabled=false

# Note: Developers must authenticate locally using one of:
# 1. Azure CLI: az login
# 2. Visual Studio Code with Azure Account extension
# 3. IntelliJ with Azure Toolkit for IntelliJ
