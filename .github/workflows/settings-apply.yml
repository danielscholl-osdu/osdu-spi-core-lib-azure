name: Settings Apply

# Reconciles repository settings from files in .github, so governance is reviewed like code:
#   - rulesets in .github/rulesets/*.json
#   - merge settings in .github/merge-settings.json (squash only, PR title becomes the commit)
#   - security settings in .github/security-on.json
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print planned changes without applying'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 4 * * 1'   # Weekly, Mondays 04:00 UTC
  push:
    branches: [main]
    paths:
      - '.github/rulesets/**'
      - '.github/merge-settings.json'
      - '.github/security-on.json'
      - '.github/scripts/settings-apply.sh'

permissions:
  contents: read

concurrency:
  group: settings-apply-${{ github.repository }}
  cancel-in-progress: false

jobs:
  settings-apply:
    name: "⚙️ Apply Repository Settings"
    runs-on: ubuntu-latest
    steps:
      - name: "Generate GitHub App Token"
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: "Checkout Code"
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1

      - name: "Apply Settings"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DRY: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
        run: bash .github/scripts/settings-apply.sh "${{ github.repository }}" $DRY
