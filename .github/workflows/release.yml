name: Release Management

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    name: "📦 Create Release"
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      # Manifest config emits path-prefixed outputs; fall back to top-level.
      version: ${{ steps.release.outputs['.--version'] || steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs['.--tag_name'] || steps.release.outputs.tag_name }}
    steps:
      - name: "Generate GitHub App Token"
        # An App token, not GITHUB_TOKEN, so the release PR triggers Validation and CodeQL.
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: "Generate Release PR"
        uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38  # v4.4.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: "🚀 Publish"
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
