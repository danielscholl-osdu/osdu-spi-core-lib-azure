name: Publish

# Puts a release on the package host. The jar and pom attached to the GitHub release are the
# source: Publish builds and attaches them when the release has none, and otherwise uploads
# what is attached, so dispatching it for a tag the host lacks restores that version.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish or restore, for example v3.1.0
        type: string
        required: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  maven:
    name: "Publish Maven Artifacts"
    runs-on: ubuntu-latest
    environment: publish
    env:
      TAG: ${{ inputs.tag }}
      ACCOUNT: ${{ vars.PACKAGES_STORAGE_ACCOUNT }}
      ARTIFACT_PATH: org/opengroup/osdu/core-lib-azure
      CI_JOB_TOKEN: ""
      GH_TOKEN: ${{ github.token }}
      # Versions below this were released from GitLab; they are only ever published from attached assets.
      BUILD_FLOOR: 3.1.0
    steps:
      - name: "Resolve Version"
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Tag $TAG is not of the form vX.Y.Z"
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "JAR=core-lib-azure-$VERSION.jar" >> "$GITHUB_ENV"
          echo "POM=core-lib-azure-$VERSION.pom" >> "$GITHUB_ENV"

      - name: "Azure Login"
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906  # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: "Stage Current Metadata"
        run: |
          blob() { az storage blob "$@" --account-name "$ACCOUNT" --auth-mode login --container-name '$web' --only-show-errors; }
          mkdir -p "staging/$ARTIFACT_PATH" assets
          metadata="maven/$ARTIFACT_PATH/maven-metadata.xml"
          pom_exists="$(blob exists --name "maven/$ARTIFACT_PATH/$VERSION/$POM" --query exists -o tsv)"
          metadata_exists="$(blob exists --name "$metadata" --query exists -o tsv)"
          if [ "$metadata_exists" = true ]; then
            blob download --name "$metadata" --file "staging/$ARTIFACT_PATH/maven-metadata.xml" --no-progress >/dev/null
          fi
          # The pom marks a version's files complete and the metadata entry marks it published.
          if [ "$pom_exists" = true ]; then
            if grep -qF "<version>$VERSION</version>" "staging/$ARTIFACT_PATH/maven-metadata.xml" 2>/dev/null; then
              echo "::error::core-lib-azure $VERSION is already published; released versions are never replaced"
              exit 1
            fi
            echo "::warning::core-lib-azure $VERSION files are on the host but the metadata does not list it; updating the metadata only"
            echo "METADATA_ONLY=true" >> "$GITHUB_ENV"
          fi

      - name: "Find Release Assets"
        id: assets
        run: |
          if ! names="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null)"; then
            echo "::error::$TAG has no GitHub release. For a version released before the move, run .github/scripts/attach-release-assets.sh first"
            exit 1
          fi
          if grep -qx "$JAR" <<<"$names" && grep -qx "$POM" <<<"$names"; then
            echo "attached=true" >> "$GITHUB_OUTPUT"
          elif [ "${METADATA_ONLY:-}" = true ]; then
            # The host already serves this version's files, so attach those rather than a rebuild with different bytes.
            for f in "$JAR" "$POM"; do
              az storage blob download --account-name "$ACCOUNT" --auth-mode login --container-name '$web' --only-show-errors \
                --name "maven/$ARTIFACT_PATH/$VERSION/$f" --file "assets/$f" --no-progress >/dev/null
            done
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "assets/$JAR" "assets/$POM" --clobber
            echo "attached=true" >> "$GITHUB_OUTPUT"
          elif [ "$(printf '%s\n' "$BUILD_FLOOR" "$VERSION" | sort -V | head -n1)" != "$BUILD_FLOOR" ]; then
            echo "::error::$VERSION predates $BUILD_FLOOR, so it is never rebuilt; attach its GitLab jar and pom with .github/scripts/attach-release-assets.sh"
            exit 1
          fi

      - name: "Checkout Code"
        if: steps.assets.outputs.attached != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          path: src

      - name: "Setup Java Environment"
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: "Build and Attach"
        if: steps.assets.outputs.attached != 'true'
        working-directory: src
        run: |
          # Consumers need a literal <version>; -Drevision would publish the pom with ${revision} in it.
          mvn --batch-mode --no-transfer-progress --settings=.mvn/community-maven.settings.xml \
            org.codehaus.mojo:versions-maven-plugin:2.18.0:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          mvn --batch-mode --no-transfer-progress --settings=.mvn/community-maven.settings.xml verify
          cp "target/$JAR" "../assets/$JAR"
          cp pom.xml "../assets/$POM"
          gh release upload "$TAG" "../assets/$JAR" "../assets/$POM" --clobber

      - name: "Download Release Assets"
        if: steps.assets.outputs.attached == 'true'
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets --pattern "$JAR" --pattern "$POM"

      - name: "Deploy to Staging"
        run: |
          mvn --batch-mode --no-transfer-progress org.apache.maven.plugins:maven-deploy-plugin:3.1.4:deploy-file \
            -Dfile="assets/$JAR" -DpomFile="assets/$POM" -DgeneratePom=false \
            -DrepositoryId=staging -Durl="file://$GITHUB_WORKSPACE/staging"
          # Maven records the version just deployed as the release; a restored older version must not displace the newest.
          metadata="staging/$ARTIFACT_PATH/maven-metadata.xml"
          newest="$(grep -o '<version>[^<]*</version>' "$metadata" | sed 's/<[^>]*>//g' | sort -V | tail -n1)"
          sed -i "s|<release>.*</release>|<release>$newest</release>|; s|<latest>.*</latest>|<latest>$newest</latest>|" "$metadata"
          md5sum "$metadata" | cut -d' ' -f1 > "$metadata.md5"
          sha1sum "$metadata" | cut -d' ' -f1 > "$metadata.sha1"

      - name: "Upload"
        run: |
          up() { az storage blob upload --account-name "$ACCOUNT" --auth-mode login --container-name '$web' --no-progress --only-show-errors --file "$1" --name "maven/${1#staging/}" "${@:2}" >/dev/null; }
          dir="staging/$ARTIFACT_PATH/$VERSION"
          if [ "${METADATA_ONLY:-}" != true ]; then
            for f in "$dir"/*; do
              [ "$f" = "$dir/$POM" ] || up "$f" --overwrite true
            done
            up "$dir/$POM" --overwrite false
          fi
          # Checksums before the index, so an interrupted run leaves the version unlisted and re-runnable.
          meta="staging/$ARTIFACT_PATH/maven-metadata.xml"
          for f in "$meta.md5" "$meta.sha1" "$meta"; do
            up "$f" --overwrite true --content-cache-control no-cache
          done

      - name: "Summary"
        env:
          PACKAGES_URL: ${{ vars.PACKAGES_URL }}
        run: |
          url="$PACKAGES_URL/maven"
          {
            echo "### core-lib-azure $VERSION published"
            echo
            echo "Repository URL: \`$url\`"
            echo
            find "staging/$ARTIFACT_PATH" -type f | sort | sed "s|^staging/|- $url/|"
          } >> "$GITHUB_STEP_SUMMARY"
